services:
  db:
    image: postgres:16-alpine
    container_name: windowapp_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ventanas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ventanas_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ventanas_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ventanas_user} -d ${POSTGRES_DB:-ventanas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: windowapp_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ventanas_user}:${POSTGRES_PASSWORD:-ventanas_pass}@db:5432/${POSTGRES_DB:-ventanas_db}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
